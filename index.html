<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superstars Cricket Club – Availability</title>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f4f4f4;
        color: #222;
    }

    /* Sticky Navigation */
    .navbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: #003399;
        padding: 12px 20px;
        display: flex;
        justify-content: center;
        gap: 30px;
        border-bottom: 4px solid gold;
    }
    .navbar a {
        color: white;
        text-decoration: none;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 6px;
        transition: background 0.3s;
    }
    .navbar a:hover, .navbar a.active {
        background: gold;
        color: #003399;
    }

    /* Hero Banner */
    .hero {
        background: linear-gradient(135deg, #003399, #0055cc);
        color: white;
        padding: 60px 20px;
        text-align: center;
        border-bottom: 6px solid gold;
        animation: fadeIn 1s ease-out;
    }

    /* Section Cards */
    .section {
        background: white;
        margin: 30px auto;
        padding: 25px;
        max-width: 1000px;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        animation: slideUp 0.6s ease-out;
    }

    /* Tabs */
    .tab-content {
        display: none;
    }
    .tab-content.active {
        display: block;
    }

    /* Buttons */
    .btn {
        padding: 10px 20px;
        margin-right: 10px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        font-weight: 600;
        color: white;
    }
    .yes { background: #28a745; }
    .no { background: #dc3545; }
    .maybe { background: #ffc107; color: #222; }

    /* Table */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    th, td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
    }
    th {
        background: #003399;
        color: white;
    }

    /* Toast Message */
    #toast {
        visibility: hidden;
        min-width: 250px;
        background-color: #003399;
        color: white;
        text-align: center;
        border-radius: 8px;
        padding: 16px;
        position: fixed;
        z-index: 2000;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        font-size: 16px;
        border: 3px solid gold;
    }
    #toast.show {
        visibility: visible;
        animation: fadeInOut 3s;
    }

    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeInOut {
        0% { opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { opacity: 0; }
    }
</style>

<script>
function showTab(tabId, element) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');

    document.querySelectorAll('.navbar a').forEach(a => a.classList.remove('active'));
    element.classList.add('active');
}

const apiBase = "https://players-availability-cscwezcuhgfmheay.uksouth-01.azurewebsites.net/api";

// Load fixtures and players on page load
window.onload = async () => {
    await loadFixtures();
    await loadPlayers();
};

// Load fixtures into dropdown
async function loadFixtures() {
    const res = await fetch(`${apiBase}/getFixtures`);
    const fixtures = await res.json();

    const select = document.getElementById("fixtureSelect");
    select.innerHTML = "";

    fixtures.forEach(f => {
        const option = document.createElement("option");
        option.value = f.matchid;
        option.textContent = f.matchname;
        select.appendChild(option);
    });

    if (fixtures.length > 0) {
        loadAvailability(fixtures[0].matchid);
    }

    select.onchange = () => loadAvailability(select.value);
}

// Load players into dropdown
async function loadPlayers() {
    const res = await fetch(`${apiBase}/getPlayers`);
    const players = await res.json();

    const select = document.getElementById("playerSelect");
    select.innerHTML = "";

    players.forEach(p => {
        const option = document.createElement("option");
        option.value = p.playerid;
        option.textContent = p.playername;
        select.appendChild(option);
    });
}

// Submit availability
async function submitAvailability(status) {
    const matchid = document.getElementById("fixtureSelect").value;
    const playerid = document.getElementById("playerSelect").value;

    const res = await fetch(`${apiBase}/submitAvailability`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ matchid, playerid, availability: status })
    });

    const result = await res.json();

    showToast("Availability Submitted ✔");
    loadAvailability(matchid);
}

// Load availability table
async function loadAvailability(matchid) {
    const res = await fetch(`${apiBase}/getMatchAvailability?matchid=${matchid}`);
    const rows = await res.json();

    const tbody = document.querySelector("#availabilityTable tbody");
    tbody.innerHTML = "";

    rows.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${r.playername}</td>
            <td>${r.availability}</td>
            <td>${new Date(r.lastupdated).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
    });
}

// Toast
function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
}

async function submitMissingName() {
    const name = document.getElementById("missingName").value;
    const email = document.getElementById("missingEmail").value;

    if (!name || !email) {
        showToast("Please enter both name and email.");
        return;
    }

    const res = await fetch(`${apiBase}/requestNameUpdate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email })
    });

    showToast("Request sent — thank you!");
}


    
</script>

</head>
<body>

<div class="hero">
    <h1>Superstars Cricket Club</h1>
    <h2>Match Availability Portal</h2>
</div>

<!-- Sticky Navigation Tabs -->
<div class="navbar">
    <a href="#" class="active" onclick="showTab('formTab', this)">Form</a>
    <a href="#" onclick="showTab('viewerTab', this)">Viewer</a>
    <a href="#" onclick="showTab('fixturesTab', this)">Fixtures</a>
</div>

<!-- Submit Availability Tab -->
<div id="formTab" class="tab-content active">
    <div class="section">
        <h3>Submit Your Availability</h3>

        <label>Select Player:</label>
        <select id="playerSelect"></select>

        <br><br>
        
        <label>Select Match:</label>
        <select id="fixtureSelect"></select>

        <br><br>


        <button class="btn yes" onclick="submitAvailability('Yes')">Yes</button>
        <button class="btn no" onclick="submitAvailability('No')">No</button>
        <button class="btn maybe" onclick="submitAvailability('Maybe')">Maybe</button>

        <br><br>
<hr>

<h3>Name not listed?</h3>
<p>If your name is missing or needs updating, please let us know.</p>

<label>Your Name:</label>
<input type="text" id="missingName" placeholder="Enter your name">

<br><br>

<label>Your Email:</label>
<input type="email" id="missingEmail" placeholder="Enter your email">

<br><br>

<button class="btn maybe" onclick="submitMissingName()">Send Request</button>

        
    </div>
</div>

<!-- Viewer Tab -->
<div id="viewerTab" class="tab-content">
    <div class="section">
        <h3>Live Availability Viewer</h3>

        <table id="availabilityTable">
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Availability</th>
                    <th>Last Updated</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Fixtures Tab -->
<div id="fixturesTab" class="tab-content">
    <div class="section">
        <h3>Fixtures</h3>
        <iframe
            src="https://www.superstarscricket.org.uk/fixtures/2026.html"
            height="900">
        </iframe>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

</body>
</html>
