<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Match Availability Viewer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    #availabilityList {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
    }

    #availabilityList div {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }

    #message {
      margin-top: 10px;
      font-style: italic;
      color: #666;
    }
  </style>
</head>

<body>

<h2>Availability for Selected Match</h2>

<label for="matchId">Match</label>
<select id="matchId">
  <option value="">Select match</option>
</select>

<div id="message"></div>
<div id="availabilityList"></div>

<script>

const apiBase = "/api";


//
// Load fixtures into dropdown
//
async function loadFixtures() {
  try {
    const res = await fetch(apiBase + "/getavailability");

    if (!res.ok) {
      throw new Error("Failed to load fixtures");
    }

    const data = await res.json();
    const matchSelect = document.getElementById("matchId");

    matchSelect.innerHTML = '<option value="">Select match</option>';

    data.fixtures.forEach(m => {
      const opt = document.createElement("option");

      // IMPORTANT: use the EXACT MatchId string
      opt.value = m.MatchId;

      opt.textContent = `${m.MatchName} (${m.MatchId})`;

      matchSelect.appendChild(opt);
    });

  } catch (err) {
    console.error(err);
    document.getElementById("message").innerHTML =
      "<span style='color:red;'>Error loading fixtures.</span>";
  }
}

//
// Load availability list
//
async function loadMatchAvailability(matchId) {

  const list = document.getElementById("availabilityList");
  const message = document.getElementById("message");

  list.innerHTML = "";
  message.innerHTML = "";

  try {
    const safeMatchId = String(matchId).trim();

    const url =
      apiBase + "/getmatchavailability?matchId=" + encodeURIComponent(safeMatchId);

    const res = await fetch(url);

    // If nothing returned yet
    if (!res.ok) {
      message.innerHTML = "No availability submitted yet for this match.";
      return;
    }

    const data = await res.json();

    if (!Array.isArray(data) || data.length === 0) {
      message.innerHTML = "No availability submitted yet for this match.";
      return;
    }

    // ✅ Display each player row
    data.forEach(row => {

      const div = document.createElement("div");

      let colour = "#666";

      if (row.Availability === "yes") colour = "green";
      if (row.Availability === "no") colour = "red";
      if (row.Availability === "maybe") colour = "orange";

      div.innerHTML =
        `${row.PlayerName}: <strong style="color:${colour}">${row.Availability}</strong>`;

      list.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    message.innerHTML =
      "<span style='color:red;'>Error loading match availability.</span>";
  }
}

//
// When match is selected
//
document.getElementById("matchId").addEventListener("change", (e) => {
  const matchId = e.target.value;

  if (matchId) {
    loadMatchAvailability(matchId);
  } else {
    document.getElementById("availabilityList").innerHTML = "";
    document.getElementById("message").innerHTML = "";
  }
});

//
// Initial load
//
document.addEventListener("DOMContentLoaded", loadFixtures);

</script>

</body>
</html>
