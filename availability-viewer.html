<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Match Availability Viewer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    #availabilityList {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
    }

    #availabilityList div {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }

    #message {
      margin-top: 10px;
      font-style: italic;
      color: #666;
    }
  </style>
</head>

<body>

<h2>Availability for Selected Match</h2>

<label for="matchId">Match</label>
<select id="matchId">
  <option value="">Select match</option>
</select>

<div id="message"></div>
<div id="availabilityList"></div>

<script>
const apiBase = "/api";

//
// Load matches into dropdown
//
async function loadFixtures() {
  try {
    const res = await fetch(apiBase + "/getavailability");
    if (!res.ok) throw new Error("Failed to load fixtures");

    const data = await res.json();
    const matchSelect = document.getElementById("matchId");

    matchSelect.innerHTML = '<option value="">Select match</option>';

    // Extract unique matches
    const uniqueMatches = [...new Map(
      data.map(m => [m.matchid, m])
    ).values()];

    uniqueMatches.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.matchid;
      opt.textContent = m.matchid; // No MatchName in Neon version
      matchSelect.appendChild(opt);
    });

  } catch (err) {
    console.error(err);
    document.getElementById("message").innerHTML =
      "<span style='color:red;'>Error loading matches.</span>";
  }
}

//
// Load availability for selected match
//
async function loadMatchAvailability(matchId) {
  const list = document.getElementById("availabilityList");
  const message = document.getElementById("message");

  list.innerHTML = "";
  message.innerHTML = "";

  try {
    const url = apiBase + "/getmatchavailability?matchId=" + encodeURIComponent(matchId);
    const res = await fetch(url);

    if (!res.ok) {
      message.innerHTML = "No availability submitted yet for this match.";
      return;
    }

    const data = await res.json();

    if (!Array.isArray(data) || data.length === 0) {
      message.innerHTML = "No availability submitted yet for this match.";
      return;
    }

    // Display each row
    data.forEach(row => {
      const div = document.createElement("div");

      let colour = "#666";
      if (row.availability === "yes") colour = "green";
      if (row.availability === "no") colour = "red";
      if (row.availability === "maybe") colour = "orange";

      div.innerHTML =
        `${row.playername}: <strong style="color:${colour}">${row.availability}</strong>`;

      list.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    message.innerHTML =
      "<span style='color:red;'>Error loading match availability.</span>";
  }
}

//
// When match is selected
//
document.getElementById("matchId").addEventListener("change", (e) => {
  const matchId = e.target.value;

  if (matchId) {
    loadMatchAvailability(matchId);
  } else {
    document.getElementById("availabilityList").innerHTML = "";
    document.getElementById("message").innerHTML = "";
  }
});

//
// Initial load
//
document.addEventListener("DOMContentLoaded", loadFixtures);
</script>

</body>
</html>
