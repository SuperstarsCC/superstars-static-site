name: Daily Heartbeat

on:
  schedule:
    - cron: "0 3 * * *"   # Runs once per day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update heartbeat file
        run: |
          echo "Last heartbeat: $(date -u)" > .heartbeat

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .heartbeat
          git commit -m "Daily heartbeat" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push
