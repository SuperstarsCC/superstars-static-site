name: Keep SQL Warm

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping API to keep SQL warm
        run: |
          curl -s https://delightful-forest-040190503.7.azurestaticapps.net/api/getAvailability
